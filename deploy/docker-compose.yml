# Déploiement complet : jeu + Caddy (HTTPS automatique).
# Si Caddy est déjà installé sur le VPS, utilisez plutôt docker-compose.game-only.yml.
services:
  game:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3000
      - MAX_ROOMS=${MAX_ROOMS:-60}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - game_data:/data
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - game
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:-defend.sayk.fr}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  game_data:
  caddy_data:
  caddy_config:
