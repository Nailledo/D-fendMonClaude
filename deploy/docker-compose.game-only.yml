# Variante : Caddy est déjà installé sur le VPS.
# Le jeu n'écoute que sur 127.0.0.1:3000 ; ajoutez le bloc de deploy/Caddyfile.host à votre Caddyfile.
services:
  game:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3000
      - MAX_ROOMS=${MAX_ROOMS:-60}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Caddy est devant le jeu : l'IP réelle des joueurs est lue dans X-Forwarded-For
      - TRUST_PROXY=1
      - SCORE_SECRET=${SCORE_SECRET:-}
      - MAX_CONN_PER_IP=${MAX_CONN_PER_IP:-8}
    volumes:
      - game_data:/data
    ports:
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M

volumes:
  game_data:
