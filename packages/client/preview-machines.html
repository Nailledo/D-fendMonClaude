<!doctype html><html><head><meta charset="utf-8"><title>Aperçu des machines</title>
<!-- Outil de contrôle : machines découpées par pnpm models:machines, avec le shader du jeu, à plusieurs instants du tir.
     ?k=tower:3-0,soldier:7  &t=secondes depuis le tir (-1 = repos)  &yaw=orientation de la tête  &cam=angle de vue  &sel=canon (0 tous, 1 droit, 2 gauche) -->
<style>html,body{margin:0;background:#6f8f5a;font:12px system-ui;color:#fff}.lab{position:fixed;text-shadow:0 1px 2px #000}</style></head><body>
<script type="module">
import * as THREE from 'three';
import { ensureModels, model, K } from './src/art/models';
import { machineOf, armAngle, seatAt, rockLoaded } from './src/art/machines';
import { InstPool } from './src/render/InstPool';
import { GB } from './src/art/builder';
const q = new URLSearchParams(location.search);
const keys = (q.get('k') ?? 'tower:3-0').split(',');
const times = (q.get('t') ?? '-1,0.08,0.16,0.25,0.6,0.9,1.4').split(',').map(Number);
const yawDeg = Number(q.get('yaw') ?? 90), camYaw = Number(q.get('cam') ?? 35);
await ensureModels(keys);
const W = innerWidth, H = innerHeight, cols = times.length, rows = keys.length;
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(W, H); r.setScissorTest(true); document.body.appendChild(r.domElement);
const cw = W / cols, ch = H / rows;
keys.forEach((key, row) => {
  const m = model(key); const mach = machineOf(m.geo);
  times.forEach((ft, col) => {
    const sc = new THREE.Scene(); sc.background = new THREE.Color((row + col) % 2 ? 0x7a9a63 : 0x6f8f5a);
    sc.add(new THREE.AmbientLight(0xffffff, 1.2)); const d = new THREE.DirectionalLight(0xffffff, 2); d.position.set(3, 6, 4); sc.add(d);
    const g = new THREE.Group(); sc.add(g);
    const yaw = (yawDeg * Math.PI) / 180;
    const base = new InstPool(mach.base, 1, g, false, m.map), head = new InstPool(mach.head, 1, g, false, m.map);
    base.begin(); base.push(0, 0, 0, 0, 1); base.end();
    head.begin(); const h = head.push(0, 0, 0, yaw, 1);
    const gun = ft >= 0 && ft < 0.45 ? Math.max(0.001, ft / 0.45) : 0;
    const ang = mach.arm && ft >= 0 ? armAngle(ft, 0) : 0;
    head.setPose(h, gun, Number(q.get('sel') ?? 1), ang, 0); head.end();
    if (mach.arm && (ft < 0 || rockLoaded(ft) > 0)) {
      const rk = new GB(1); rk.rock(1, 0x8a8178); const rp = new InstPool(rk.build(), 1, g, false);
      const p = seatAt(mach.arm, ang, { x: 0, y: 0, z: 0 }); const load = ft < 0 ? 1 : rockLoaded(ft);
      rp.begin(); rp.push(p.z * Math.sin(yaw), p.y + (1 - load) * 0.5, p.z * Math.cos(yaw), 0, mach.arm.rockR * (0.4 + 0.6 * load)); rp.end();
    }
    const hgt = m.meta.height; const cam = new THREE.PerspectiveCamera(35, cw / ch, 0.1, 100);
    const ca = (camYaw * Math.PI) / 180; cam.position.set(Math.sin(ca) * hgt * 2.2, hgt * 1.0, Math.cos(ca) * hgt * 2.2); cam.lookAt(0, hgt * 0.62, 0);
    const x = col * cw, y = H - (row + 1) * ch; r.setViewport(x, y, cw, ch); r.setScissor(x, y, cw, ch); r.render(sc, cam);
    const lab = document.createElement('div'); lab.className = 'lab'; lab.style.left = x + 4 + 'px'; lab.style.top = row * ch + 4 + 'px'; lab.textContent = `${key} t=${ft} a=${ang.toFixed(2)}`; document.body.appendChild(lab);
  });
});
document.title = 'ok';
</script></body></html>
