<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Aperçu des modèles cuits</title>
<style>
  html, body { margin: 0; background: #6f8f5a; font: 12px system-ui, sans-serif; color: #fff; }
  canvas { position: fixed; inset: 0; }
  .lab { position: fixed; text-shadow: 0 1px 2px #000; pointer-events: none; text-align: center; }
  nav { position: fixed; top: 4px; left: 6px; z-index: 2; }
  nav a { color: #fff; margin-right: 8px; }
</style>
</head>
<body>
<!-- Outil de contrôle : affiche les GLB de public/models/ en grille.  ?g=enemy|hero|soldier|tower|decor|gate|spawn  &yaw=degrés  &k=clé,clé  &yaws=0,90,180  &skin=5e3a26 (couleur de peau des héros) -->
<nav id="nav"></nav>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';

const q = new URLSearchParams(location.search);
const group = q.get('g') ?? 'hero';
const yaw = (Number(q.get('yaw') ?? 25) * Math.PI) / 180;
const cols = Number(q.get('cols') ?? 5);
const nav = document.getElementById('nav');
for (const g of ['hero', 'soldier', 'enemy', 'tower', 'decor', 'gate', 'spawn']) nav.innerHTML += `<a href="?g=${g}">${g}</a>`;

const manifest = (await (await fetch('/models/manifest.json')).json()).models;
// ?k=hero:roi,hero:ethan : seulement ces modèles ; ?yaws=0,90,180 : un modèle sous plusieurs angles
const only = q.get('k')?.split(',');
const yawList = q.get('yaws')?.split(',').map((v) => (Number(v) * Math.PI) / 180);
let keys = Object.keys(manifest).filter((k) => (only ? only.includes(k) : k.startsWith(group + ':')));
if (yawList) keys = keys.flatMap((k) => yawList.map(() => k));
const W = innerWidth, H = innerHeight;
const rows = Math.ceil(keys.length / cols);
const cw = W / cols, ch = (H - 20) / rows;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setScissorTest(true);
document.body.appendChild(renderer.domElement);
const loader = new GLTFLoader();
const cells = [];

await Promise.all(keys.map(async (key, i) => {
  const gltf = await loader.loadAsync('/models/' + manifest[key].file);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(i % 2 ? 0x7a9a63 : 0x6f8f5a);
  // ?parts=1 : chaque sommet coloré selon sa partie animée (corps gris, jambes rouge/orange, bras bleu/cyan, ailes vert/jaune)
  const PART_COL = [[0.6, 0.6, 0.6], [0.9, 0.15, 0.15], [1, 0.6, 0.1], [0.15, 0.35, 0.95], [0.1, 0.85, 0.9], [0.2, 0.8, 0.2], [0.95, 0.9, 0.2], [1, 1, 1], [0.6, 0.3, 0.8], [0.5, 0.2, 0.1]];
  gltf.scene.traverse((o) => {
    if (o.isMesh) {
      const map = o.material.map ?? null;
      const a = o.geometry.attributes._anim;
      if (q.get('islands')) {
        // ?islands=1 : chaque morceau séparé (îlot de triangles connectés) dans sa couleur
        const g = o.geometry, pos = g.attributes.position, n = pos.count, idx = g.index.array;
        const par = Array.from({ length: n }, (_, i) => i);
        const find = (x) => (par[x] === x ? x : (par[x] = find(par[x])));
        const uni = (x, y) => { par[find(x)] = find(y); };
        const keys = new Map();
        for (let i = 0; i < n; i++) { const k = Math.round(pos.getX(i) * 2000) + ',' + Math.round(pos.getY(i) * 2000) + ',' + Math.round(pos.getZ(i) * 2000); if (keys.has(k)) uni(i, keys.get(k)); else keys.set(k, i); }
        for (let t = 0; t < idx.length; t += 3) { uni(idx[t], idx[t + 1]); uni(idx[t], idx[t + 2]); }
        const roots = new Map(); const c = new Float32Array(n * 3);
        const pal = [[0.95, 0.3, 0.3], [0.3, 0.6, 0.95], [0.3, 0.85, 0.35], [0.95, 0.85, 0.2], [0.8, 0.4, 0.9], [0.2, 0.9, 0.9], [1, 0.6, 0.2], [0.6, 0.6, 0.6], [0.5, 0.3, 0.1], [1, 1, 1], [0.1, 0.4, 0.2], [0.9, 0.5, 0.7]];
        for (let i = 0; i < n; i++) { const r = find(i); if (!roots.has(r)) roots.set(r, roots.size); c.set(pal[roots.get(r) % pal.length], i * 3); }
        g.setAttribute('color', new THREE.BufferAttribute(c, 3));
        o.material = new THREE.MeshLambertMaterial({ vertexColors: true });
        return;
      }
      if (q.get('parts') && a) {
        const c = new Float32Array(a.count * 3);
        for (let i = 0; i < a.count; i++) c.set(PART_COL[Math.round(a.getX(i))] ?? [0, 0, 0], i * 3);
        o.geometry.setAttribute('color', new THREE.BufferAttribute(c, 3));
        o.material = new THREE.MeshLambertMaterial({ vertexColors: true });
        return;
      }
      const sk = o.geometry.attributes._skin;
      if (q.get('skin') && sk) {
        // ?skin=5e3a26 : couleur de peau appliquée aux sommets marqués par pnpm models:skins (base #e1b08d)
        const to = new THREE.Color('#' + q.get('skin')), base = new THREE.Color('#e1b08d');
        const g = o.geometry, n = g.attributes.position.count;
        const c = g.attributes.color ? Float32Array.from({ length: n * 3 }, (_, k) => g.attributes.color.getComponent(Math.floor(k / 3), k % 3)) : new Float32Array(n * 3).fill(1);
        for (let i = 0; i < n; i++) if (sk.getX(i) > 0.5) { c[i * 3] *= to.r / base.r; c[i * 3 + 1] *= to.g / base.g; c[i * 3 + 2] *= to.b / base.b; }
        g.setAttribute('color', new THREE.BufferAttribute(c, 3));
      }
      o.material = new THREE.MeshLambertMaterial({ vertexColors: !!o.geometry.attributes.color, map, ...(manifest[key].cutout ? { alphaTest: 0.5, side: THREE.DoubleSide } : {}) });
    }
  });
  scene.add(gltf.scene);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x556644, 2.2));
  const sun = new THREE.DirectionalLight(0xffffff, 1.6);
  sun.position.set(2, 4, 3);
  scene.add(sun);
  const box = new THREE.Box3().setFromObject(gltf.scene);
  const size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const r = Math.max(size.x, size.y, size.z) * 0.62;
  const cam = new THREE.PerspectiveCamera(30, cw / ch, 0.01, 1000);
  const d = r / Math.tan((15 * Math.PI) / 180) * 1.05;
  const yw = yawList ? yawList[i % yawList.length] : yaw;
  const zoom = Number(q.get('zoom') ?? 1);
  cam.position.set(c.x + Math.sin(yw) * d / zoom, c.y + d * 0.28 / zoom, c.z + Math.cos(yw) * d / zoom);
  cam.lookAt(c);
  cells[i] = { scene, cam };
  const lab = document.createElement('div');
  lab.className = 'lab';
  lab.textContent = `${key}  (${manifest[key].tris} tris)`;
  lab.style.left = (i % cols) * cw + 'px';
  lab.style.width = cw + 'px';
  lab.style.top = 20 + Math.floor(i / cols) * ch + ch - 16 + 'px';
  document.body.appendChild(lab);
}));

cells.forEach((cell, i) => {
  const x = (i % cols) * cw, y = H - 20 - (Math.floor(i / cols) + 1) * ch;
  renderer.setViewport(x, y, cw, ch);
  renderer.setScissor(x, y, cw, ch);
  renderer.render(cell.scene, cell.cam);
});
document.title = 'prêt ' + keys.length;
</script>
</body>
</html>
